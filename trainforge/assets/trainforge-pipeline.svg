<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="310" viewBox="0 0 1600 310" role="img" aria-labelledby="title desc">
  <title id="title">TrainForge in one line</title>
  <desc id="desc">A model and goal enter TrainForge. TrainForge moves from idea to code, training and evaluation, then returns the best verified model.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#0176d3"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <text x="58" y="105" fill="#587087" font-size="15" font-weight="700" letter-spacing="1.6">INPUT</text>
    <text x="58" y="158" fill="#032d60" font-size="34" font-weight="750">Model + goal</text>
    <text x="58" y="197" fill="#587087" font-size="18">Define what should improve.</text>

    <path d="M351 155H421" fill="none" stroke="#0176d3" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="422" y="42" width="756" height="226" rx="12" fill="#0176d3"/>
    <text x="464" y="91" fill="#d9efff" font-size="15" font-weight="750" letter-spacing="1.7">AUTONOMOUS R&amp;D</text>
    <text x="464" y="153" fill="#ffffff" font-size="44" font-weight="760">TrainForge</text>
    <text x="464" y="207" fill="#ffffff" font-size="24" font-weight="700">IDEA  →  CODE  →  TRAIN  →  EVALUATE</text>
    <text x="464" y="241" fill="#d9efff" font-size="17">Learn from the result. Repeat.</text>

    <path d="M1179 155H1249" fill="none" stroke="#0176d3" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="1270" y="105" fill="#587087" font-size="15" font-weight="700" letter-spacing="1.6">OUTPUT</text>
    <text x="1270" y="151" fill="#032d60" font-size="31" font-weight="750">Best verified</text>
    <text x="1270" y="190" fill="#032d60" font-size="31" font-weight="750">model</text>
  </g>
</svg>
